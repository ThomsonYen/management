# Frontend configuration

# How many seconds a toast (e.g. "Marked done", "Deleted", "Removed from Focus")
# stays visible with its Undo button before it disappears.
undo_toast_seconds: 5

# Default max height (px) for each day's content box on the Goals page.
# Content that exceeds this height becomes scrollable.
goal_day_box_height_px: 400
