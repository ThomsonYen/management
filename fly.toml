# Fly.io config — used by `fly deploy` and the dashboard "Launch from GitHub" flow.
app = "management-wxisjq"
primary_region = "sjc"

swap_size_mb = 2048

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  APP_ORIGIN = "https://management-wxisjq.fly.dev"  # update if the app name or domain changes
  COOKIE_SECURE = "1"
  BACKUP_LOOP_ENABLED = "0"  # enable after the backup loop is rewritten for rclone/Tigris

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine warm. "suspend" silently falls back to a full stop here
  # (the /data volume has to be unmounted), so every idle period meant a cold
  # boot: ~5s of Python imports + startup vault scan before uvicorn binds 8080,
  # which outran the proxy's connect budget and produced PM05 errors on the
  # first request back.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
