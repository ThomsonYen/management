# Fly.io config — used by `fly deploy` and the dashboard "Launch from GitHub" flow.
# Set the app name during launch (or edit it here); it must be globally unique.
app = "management-tyen"
primary_region = "sjc"

swap_size_mb = 2048

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  APP_ORIGIN = "https://management-tyen.fly.dev"  # update if the app name or domain changes
  COOKIE_SECURE = "1"
  BACKUP_LOOP_ENABLED = "0"  # enable after the backup loop is rewritten for rclone/Tigris

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
